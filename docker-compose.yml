
services:

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Auths-service
    env_file: ./.env
    depends_on:
      - redis
    ports:
      - "3000:3000"
    environment:
      - KAFKA_BROKERS=kafka:29092
    networks:
      - kafka-net

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: auth_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kafka-net

volumes:
  redis_data:
    driver: local

networks:
  kafka-net:
    external: true
